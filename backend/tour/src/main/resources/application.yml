server:
  port: 8083

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://tour-mysql:3306/tourdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:JelfesyMS6HKEZerkegVucBD0GMcgJN0ZTzvuXxnG/0=}  # isti kao u Go servisima

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error
    org.springframework.security: TRACE
    com.example.tour.security: TRACE
    io.jsonwebtoken: DEBUG
    org.springframework.web: DEBUG
