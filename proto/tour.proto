syntax = "proto3";
package tour.v1;

option java_multiple_files = true;
option java_package = "com.example.tour.grpc";
option java_outer_classname = "TourProto";

message Tour {
  string id = 1;           // UUID kao string
  string authorId = 2;     // UUID
  string name = 3;
  string description = 4;
  string difficulty = 5;   // EASY | MEDIUM | HARD
  string status = 6;       // npr. PUBLISHED/DRAFT/...
  int64  priceCents = 7;
  repeated string tags = 8; 
  int64  createdAt = 9;     
  int64  updatedAt = 10;   
}

message ListToursRequest {
  string authorId = 1; 
}

message ListToursResponse {
  repeated Tour items = 1;
}

message CreateTourRequest {
  string authorId    = 1;
  string name        = 2;
  string description = 3;
  string difficulty  = 4;
  int64  priceCents  = 5;
  string status      = 6;             
  repeated string tags = 7;           
}

message CreateTourResponse {
  Tour tour = 1;
}

message DeleteTourRequest { string id = 1; }
message DeleteTourResponse {}

service TourService {
  rpc ListTours  (ListToursRequest)  returns (ListToursResponse);
  rpc CreateTour (CreateTourRequest) returns (CreateTourResponse);
  rpc DeleteTour (DeleteTourRequest) returns (DeleteTourResponse);
}
