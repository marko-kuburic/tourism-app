version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      PURCHASE_URL: http://purchase:8085 
      TOUR_GRPC_ADDR: tour:9094
      STAKEHOLDER_GRPC_ADDR: backend:9095
      PROTO_DIR: /proto

      # --- OpenTelemetry ---
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: project=tourism-app,env=dev
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
    depends_on:
      - backend
      - blog
      - following
      - tour
      - purchase
    restart: unless-stopped
    labels:
      - "compose.service=gateway"
    networks:
      - default
      - appnet
      - observability
    volumes:
      - ./proto:/proto:ro
      - ./monitoring/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro

  backend:
    build:
      context: .
      dockerfile: backend/stakeholders/Dockerfile
    ports:
      - "8081:8081"
      - "9095:9095"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: tourism
      JWT_SECRET: "JelfesyMS6HKEZerkegVucBD0GMcgJN0ZTzvuXxnG/0="

      # --- OpenTelemetry ---
      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: project=tourism-app,env=dev
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
    volumes:
      - ./monitoring/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - stakeholder_uploads:/app/uploads
    restart: unless-stopped
    labels:
      - "compose.service=backend"
    networks:
      - default
      - observability

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tourism
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/stakeholders/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 20
    command: --default-authentication-plugin=mysql_native_password
    labels:
      - "compose.service=mysql"

  mongodb:
    image: mongo:6
    container_name: tourism-app-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 30s
      timeout: 5s
      retries: 20

  blog:
    build:
      context: ./backend/blog
    environment:
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: "tourism"
      MONGO_COLLECTION: "blogs"
      JWT_SECRET: "JelfesyMS6HKEZerkegVucBD0GMcgJN0ZTzvuXxnG/0="
      FOLLOWING_API_URL: "http://following:8083"

      UPLOAD_DIR: "/data/uploads"
      UPLOADS_PUBLIC_PREFIX: "/uploads"
      # --- OpenTelemetry ---
      OTEL_SERVICE_NAME: blog
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: project=tourism-app,env=dev
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      - ./monitoring/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - ./uploads:/data/uploads 
    restart: unless-stopped
    labels:
      - "compose.service=blog"
    networks:
      - default
      - observability

  tour-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tourdb
    volumes:
      - tour_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 10s
      retries: 20
    command: --default-authentication-plugin=mysql_native_password
    labels:
      - "compose.service=tour-mysql"

  tour:
    build:
      context: .
      dockerfile: backend/tour/Dockerfile
    environment:
      - DB_URL=jdbc:mysql://tour-mysql:3306/tourdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USER=root
      - DB_PASSWORD=password
      - JWT_SECRET=JelfesyMS6HKEZerkegVucBD0GMcgJN0ZTzvuXxnG/0=
      - PURCHASE_BASE_URL=http://purchase:8085
      - GRPC_SERVER_PORT=9094

      # --- OpenTelemetry ---
      - OTEL_SERVICE_NAME=tour
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=project=tourism-app,env=dev
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
    labels:
      - "compose.service=tour"
    networks:
      - default
      - observability
    volumes:
      - ./monitoring/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      tour-mysql:
        condition: service_healthy
    ports:
      - "8084:8084"
      - "9094:9094"

  following:
    build:
      context: ./backend/following
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpassword
      STAKEHOLDERS_API_URL: http://backend:8081

      # --- OpenTelemetry ---
      OTEL_SERVICE_NAME: following
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: project=tourism-app,env=dev
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
    volumes:
      - ./monitoring/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      neo4j:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "8083:8083"
    labels:
      - "compose.service=following"
    networks:
      - default
      - observability

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    labels:
      - "compose.service=neo4j"

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
      #- /app/node_modules
    command: sh -lc "npm ci && npm run dev -- --host --port 3000"
    ports:
      - "3000:3000"
    environment:
      VITE_AUTH_API_URL: http://localhost:8080/auth
      VITE_API_BASE_URL: http://localhost:8081
      VITE_FOLLOWING_API_URL: http://localhost:8083
      VITE_BLOG_API_URL: http://localhost:8082
      VITE_TOURS_API_URL: http://localhost:8080/tour
      VITE_PURCHASE_API_URL: http://localhost:8080/purchase
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    labels:
      - "compose.service=frontend"

  purchase:
    build: ./backend/purchase
    environment:
      DB_DSN: root:password@tcp(purchase-mysql:3306)/purchasedb?parseTime=true&charset=utf8mb4&loc=Local
      JWT_SECRET: "JelfesyMS6HKEZerkegVucBD0GMcgJN0ZTzvuXxnG/0="
      TOUR_BASE_URL: http://gateway:8080/tour

      # --- OpenTelemetry ---
      OTEL_SERVICE_NAME: purchase
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: project=tourism-app,env=dev
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
    volumes:
      - ./monitoring/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on: 
      - purchase-mysql
      - tour
    ports: 
      - "8085:8085"
    labels:
      - "compose.service=purchase"
    networks: 
      - appnet
      - observability

  purchase-mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: purchasedb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - purchase_db:/var/lib/mysql
    labels:
      - "compose.service=purchase-mysql"
    networks:
      - appnet
      - observability

networks:
  appnet:
    driver: bridge
  observability:
    external: true
    name: observability_net

volumes:
  mongo_data:
  mysql_data:
  tour_mysql_data:
  neo4j_data:
  stakeholder_uploads:
  purchase_db:
